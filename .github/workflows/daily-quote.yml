name: daily-quote

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "指定发第几条（留空则按日期自动算）"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-quote
  cancel-in-progress: false

jobs:
  quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 体检推文库
        run: node check-quotes.mjs --min 440 --max 620

      - name: 推送今天的段落
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "::error::缺少 Secret PUSHPLUS_TOKEN"
            exit 1
          fi
          if [ -n "${{ inputs.day }}" ]; then
            node daily-quote.mjs --notify --day "${{ inputs.day }}"
          else
            node daily-quote.mjs --notify
          fi
